version: "3"
services:
  bibel:
    build:
      # build the actual app
      context: .
      dockerfile: image/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: on-failure
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy: {}
