version: '3'
services:
  app:
    network_mode: host
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CHANNEL_URL: ${VITE_CHANNEL_URL}
        VITE_CHANNEL_KEY: ${VITE_CHANNEL_KEY}
    restart: on-failure
    labels:
        caddy: ${DOMAIN}
        caddy.reverse_proxy: "{{upstreams}}"

networks:
  caddy: {}