<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bulma.min.css">
    <link rel="stylesheet" href="tachyons.min.css">
    <script src="axios.min.js"></script>
    <script src="vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono&family=Fira+Sans:wght@200;400;700&display=swap"
        rel="stylesheet">
    <title>Admin</title>
    <style>
        #draggable {
            position: absolute;
            z-index: 1;
        }

        .ff-mono {
            font-family: "Fira Mono";
        }

        .ff-1 {
            font-family: "Fira Sans";
            font-weight: 400;
        }

        .w6 {
            width: 32rem
        }

        .outline-0 {
            outline: 0;
        }

        .move {
            cursor: move
        }
    </style>
</head>

<body class="">
    <div id="app" class="ff-1 pa3 pt5">
        <div class="tc w6 z-0 absolute bottom-2 right-1">
            <button class="button is-ghost" @click="dec">&larr;</button>
            <button class="button is-danger" @click="rm">&minus;</button>
            <div class="button is-rounded is-static ff-mono">{{i+1}}/{{words.length}}</div>
            <button class="button is-success" @click="add">&plus;</button>
            <button class="button is-ghost" @click="inc">&rarr;</button>
        </div>

        <div class="w6" id="draggable" class="ba white">
            <div id="draggableheader" @mousedown="dragMouseDown" class="bg-gray w-100 ba tc">
                <img src="move.svg" class="h1 v-mid move">
                <!-- <button @click="hor_center()" class="bg-white hover-bg-light-gray bn"><img src="ha.png"
                        class="h1"></button>
                <button @click="ver_center()" class="bg-white hover-bg-light-gray bn"><img src="va.png"
                        class="h1"></button> -->
            </div>

            <div>
                <input class="w5 tracked ttu ph3 pv1 outline-0 bg-white ba black tl pr3" v-model="words[i].reference">
                <button class="button is-info is-small" @click="get_bible" tabindex="-1">Hämta bibelord</button>
                <textarea class="w-100 h5 bg-white black pa3 outline-0 ba" v-model="words[i].text"></textarea>
            </div>
        </div>
    </div>
</body>
<script src="https://www.gstatic.com/firebasejs/8.0.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.13.2/firebase-database.js"></script>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyChsTmAG3quMze7D-CycF4BHqVvTVbyAr0",
        authDomain: "bibelord-web.firebaseapp.com",
        databaseURL: "https://bibelord-web.firebaseio.com",
        projectId: "bibelord-web",
        storageBucket: "bibelord-web.appspot.com",
        messagingSenderId: "301360703596",
        appId: "1:301360703596:web:8ff608549aa61c6701d049"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database()

    function mod(n, m) {
        return ((n % m) + m) % m;
    }
    var app = new Vue({
        el: "#app",
        data: {
            i: 0,
            pos: [0, 0],
            words: [{
                reference: "",
                text: ""
            }],
            drag: null,
            pos3: 0,
            pos4: 0,
        },
        watch: {
            i() {
                this.write()
            },
            pos() {
                this.write()
            },
            words: {
                handler() {
                    this.write()
                },
                deep: true
            }
        },
        methods: {
            add() {
                this.words.push({
                    reference: "",
                    text: ""
                })
                this.i++
            },
            rm() {
                if (this.words.length > 1) {
                    this.words.splice(this.i, 1)
                    this.i--;
                }
            },
            write() {
                var o = {
                    i: this.i,
                    pos: this.pos,
                    words: this.words
                }
                db.ref("/").set(o)
            },
            inc() {
                this.i = Math.min(this.i + 1, this.words.length - 1)
            },
            dec() {
                this.i = Math.max(this.i - 1, 0)
            },
            hor_center() {
                this.pos[0] = screen.width / 2
                this.moveToPos()
            },
            get_bible() {
                // not implemented
                var ref = this.words[this.i].reference
                var url = "https://sfb.lind.sk/" + ref + "?sfb15"
                console.log(url)
                axios.get(url).then(s => {
                    console.log(s)
                }).catch(s => {
                    console.error(s)
                })

            },
            dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                // get the mouse cursor position at startup:
                this.pos3 = e.clientX;
                this.pos4 = e.clientY;
                document.onmouseup = this.closeDragElement;
                // call a function whenever the cursor moves:
                document.onmousemove = this.elementDrag;
            },
            elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                // calculate the new cursor position:
                var pos1 = this.pos3 - e.clientX;
                var pos2 = this.pos4 - e.clientY;
                this.pos3 = e.clientX;
                this.pos4 = e.clientY;

                // set the element's new position:
                var newpos2 = (this.drag.offsetTop - pos2)
                var newpos1 = (this.drag.offsetLeft - pos1)
                this.pos = [newpos1, newpos2]
                this.moveToPos()
            },
            moveToPos() {
                this.drag.style.top = this.pos[1] + "px";
                this.drag.style.left = this.pos[0] + "px";
            },
            closeDragElement() {
                // stop moving when mouse button is released:
                document.onmouseup = null;
                document.onmousemove = null;
            }
        },
        mounted() {
            this.drag = document.getElementById("draggable")

            db.ref("/").once('value').then(s => {
                var t = s.val()
                this.i = Math.min(t.i, t.words.length - 1)
                this.pos = t.pos

                this.drag.style.top = this.pos[1] + "px";
                this.drag.style.left = this.pos[0] + "px";

                this.words = t.words
            })
        }
    })
</script>

</html>
